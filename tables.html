<!DOCTYPE hmtml>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    </head>
    <body>
        <table>
               <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                    <th>Salary</th>
                    <th>City</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Lucky</td>
                        <td>Don</td>
                        <td>25</td>
                        <td>10,0000</td>
                        <td>Nairobi</td>
                        </tr>

                        <tr>
                        <td>John</td>
                        <td>Juma</td>
                        <td>30</td>
                        <td>20,0000</td>
                        <td>Mombasa</td>
                        </tr>

                        <tr>
                        <td>Jane</td>
                        <td>Atieno</td>
                        <td>28</td>
                        <td>15,0000</td>
                        <td>Kisumu</td>
                        </tr>

                        <tr>
                        <td>Mary</td>
                        <td>Njeri</td>
                        <td>35</td>
                        <td>25,0000</td>
                        <td>Nakuru</td>
                        </tr>

                        <tr>
                        <td>Peter</td>
                        <td>Kamau</td>
                        <td>40</td>
                        <td>30,0000</td>
                        <td>Eldoret</td>
                        </tr>
                </tbody> 
                    
        </table>

        <!-- List Unordered -->
         <ul>
            <li>Nairobi</li>
            <li>Mombasa</li>
            <li>Kisumu</li>
            <li>Nakuru</li>
            <li>Eldoret</li>
         </ul>

        </body>
        </html>
